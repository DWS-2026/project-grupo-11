<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Equipo - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="form-container">
            <h2 class="text-center mb-4 text-white"> Registrar Equipo</h2>
            <form id="teamForm">
                <div class="mb-3">
                    <label class="form-label">Nombre del Equipo</label>
                    <input type="text" class="form-control" id="teamName" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Estadio</label>
                    <input type="text" class="form-control" id="stadiumName" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Logo (PNG/JPG)</label>
                    <input type="file" class="form-control" id="teamLogo" accept="image/*" required>
                    <div class="logo-preview" id="logoPreview"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Guardar Equipo</button>
                <a href="Pantalla_Gestion_Equipos.html" class="btn btn-secondary w-100 mt-2">Volver a Pantalla de Gestión</a>
            </form>
        </div>
    </div>
    <script>
        const teamForm = document.getElementById('teamForm');
        
        teamForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Simulación de recopilación
            console.log("Datos del equipo guardados localmente");

            Swal.fire({
                title: '¡Recopilado!',
                text: 'Datos guardados localmente. Volviendo al panel...',
                icon: 'success',
                background: '#1e293b',
                color: '#ffffff',
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                // Navegación automática al terminar la alerta
                window.location.href = 'Pantalla_Gestion_Equipos.html';
            });
        });
    </script>
</body>
</html>
