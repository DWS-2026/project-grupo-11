<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Account - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="form-container">
            <h2 class="text-center mb-4 text-white"> Registrar Nueva Cuenta de Periodista </h2>
            <form id="accountForm">
                <div class="mb-3">
                    <label class="form-label">Nombre del Usuario (Nombre y apellidos)</label>
                    <input type="text" class="form-control" id="userName" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="userEmail" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="userPassword" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Equipo asignado para valorar</label>
                    <select class="form-select" id="favoriteTeam" required>
                        <option value="" selected disabled>Selecciona un equipo...</option>
                        <option value="real_madrid">Real Madrid</option>
                        <option value="fc_barcelona">FC Barcelona</option>
                        <option value="atletico_madrid">Atlético de Madrid</option>
                        <option value="sevilla_fc">Sevilla FC</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Avatar (PNG/JPG)</label>
                    <input type="file" class="form-control" id="userAvatar" accept="image/*" required>
                    <div class="logo-preview" id="avatarPreview"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Guardar Cuenta</button>
                <a href="Account_Management_Screen.html" class="btn btn-secondary w-100 mt-2">Volver a Pantalla de Gestión</a>
            </form>
        </div>
    </div>

    <script>
        /**
         * Account registration logic.
         * All internal variables and logs are in English to follow the course guidelines.
         */
        const accountForm = document.getElementById('accountForm');
        
        accountForm.addEventListener('submit', (event) => {
            event.preventDefault();
            
            // Success message simulation for internal debugging
            console.log("Journalist account data saved locally");

            Swal.fire({
                title: '¡Recopilado!',
                text: 'Datos del periodista guardados correctamente. Volviendo al panel...',
                icon: 'success',
                background: '#1e293b',
                color: '#ffffff',
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                // Redirect to Account Management Screen
                window.location.href = 'Account_Management_Screen.html';
            });
        });
    </script>
</body>
</html>
