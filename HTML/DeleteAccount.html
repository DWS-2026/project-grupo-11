<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account - FootLeague</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

    <div class="container">
        <div class="delete-container text-center">
            <div class="option-icon mb-4" style="background: var(--danger); color: white; width: 64px; height: 64px; font-size: 2rem;">
                🗑️
            </div>
            <h2 class="mb-3 text-white">Eliminar Cuenta</h2>
            <p class="text-white-50 mb-4">Escribe el correo de la cuenta para borrarla del sistema.</p>

            <form id="deleteForm">
                <div class="mb-4">
                    <label class="form-label">Correo de la Cuenta</label>
                    <input type="email" class="form-control" id="accountEmail" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger-custom p-3 mb-2">
                        Confirmar Eliminación
                    </button>
                    
                    <a href="Account_Management_Screen.html" class="btn btn-return p-2">
                         Volver a Gestión de Cuentas
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        /**
         * Delete account form submission logic.
         * Using English for internal logic and comments.
         */
        const deleteForm = document.getElementById('deleteForm');

        deleteForm.addEventListener('submit', (event) => {
            event.preventDefault();
            
            const emailToDelete = document.getElementById('accountEmail').value;
            
            // Console logging for debugging purposes (English)
            console.log("Deleting account associated with:", emailToDelete);
            
            // Redirection to the management screen
            window.location.href = 'Account_Management_Screen.html';
        });
    </script>
</body>
</html>
