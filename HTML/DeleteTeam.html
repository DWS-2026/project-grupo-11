<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Equipo - FootLeague</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

    <div class="container">
        <div class="delete-container text-center">
            <div class="option-icon mb-4" style="background: var(--danger); color: white; width: 64px; height: 64px; font-size: 2rem;">
                🗑️
            </div>
            <h2 class="mb-3 text-white">Eliminar Equipo</h2>
            <p class="text-white-50 mb-4">Escribe el nombre del equipo para borrarlo del sistema.</p>

            <form id="deleteForm">
                <div class="mb-4">
                    <label class="form-label">Nombre del Equipo</label>
                    <input type="text" class="form-control" id="teamName" required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger-custom p-3 mb-2">
                        Confirmar Eliminación
                    </button>
                    
                    <a href="Pantalla_Gestion_Equipos.html" class="btn btn-return p-2">
                         Volver a Gestión de Equipos
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('deleteForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const nombre = document.getElementById('teamName').value;
            console.log("Eliminando equipo:", nombre);
            window.location.href = 'Pantalla_Gestion_Equipos.html';
        });
    </script>
</body>
</html>
