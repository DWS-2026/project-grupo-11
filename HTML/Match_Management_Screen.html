<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestión de Partidos - FootLeague</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light"> 
    <div class="container py-5">
        <h1 class="mb-4 text-white">Administración de Partidos</h1>
        
        <div class="row g-4 justify-content-center">
            <div class="col-md-5">
                <div class="card option-card h-100 p-3"> 
                    <div class="card-body text-center">
                        <div class="option-icon mb-3" style="background: linear-gradient(180deg,#bbf7d0,#10b981); color: #04201a;">➕</div>
                        <h5 class="card-title">Crear Partido</h5>
                        <p class="card-text">Registra un nuevo encuentro y sus sucesos (goles, tarjetas...)</p>
                        <button class="btn btn-primary w-100 mt-3" onclick="navigateTo('CreateMatch.html')">Crear Nuevo</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-5">
                <div class="card option-card h-100 p-3">
                    <div class="card-body text-center">
                        <div class="option-icon mb-3" style="background: linear-gradient(180deg,#fef08a,#f59e0b); color: #2b1500;">📋</div>
                        <h5 class="card-title">Gestionar Partidos</h5>
                        <p class="card-text">Ver listado de encuentros para editar resultados o eliminar registros</p>
                        <button class="btn btn-warning w-100 mt-3" onclick="navigateTo('ModifyMatch.html')">Ir al Listado</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <a href="Admin_Page.html" class="btn btn-outline-secondary">Volver al Panel</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        /**
         * Navigation logic
         * Consistent with the rest of the management modules.
         */
        function navigateTo(page) {
            window.location.href = page;
        }
    </script>
</body>
</html>
