<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Cuentas - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 p-4" style="background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1) !important;">
                    <div class="text-center mb-4">
                        <div class="option-icon mx-auto mb-3" style="background: #38bdf8; color: white; width: 60px; height: 60px; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
                            🔍
                        </div>
                        <h2 class="text-white fw-bold">Buscar Usuario</h2>
                        <p class="text-white-50">Introduce el correo para modificar el perfil</p>
                    </div>

                    <form id="searchForm">
                        <div class="mb-4">
                            <label class="form-label text-info">Correo Electrónico</label>
                            <input type="email" class="form-control form-control-lg" id="searchEmail" placeholder="juan.perez@prensa.com" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                                Buscar Cuenta
                            </button>
                            <a href="Account_Management_Screen.html" class="btn btn-outline-secondary">
                                Volver al Panel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Account Search Simulation Logic.
         * Code quality: Using English for variables and comments.
         */
        const searchForm = document.getElementById('searchForm');

        searchForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const emailInput = document.getElementById('searchEmail').value.toLowerCase();
            
            // Simulation of a database (Mock Data)
            // FIXED: Added missing bracket and corrected the page destination
            const registeredUsers = [
                { email: "juan.perez@prensa.com", page: "edit-profile.html" }
            ];

            // Internal log in English
            console.log("Searching for user: " + emailInput);

            // Find if the user exists in our local list
            const foundUser = registeredUsers.find(user => user.email === emailInput);

            if (foundUser) {
                Swal.fire({
                    title: '¡Usuario Encontrado!',
                    text: 'Redirigiendo al perfil de ' + emailInput,
                    icon: 'success',
                    background: '#1e293b',
                    color: '#ffffff',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    // Redirect to edit-profile.html
                    window.location.href = foundUser.page;
                });
            } else {
                Swal.fire({
                    title: 'Error',
                    text: 'No se ha encontrado ninguna cuenta con ese correo.',
                    icon: 'error',
                    background: '#1e293b',
                    color: '#ffffff',
                    confirmButtonColor: '#38bdf8'
                });
            }
        });
    </script>
</body>
</html>
