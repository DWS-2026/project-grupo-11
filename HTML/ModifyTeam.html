<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Equipo - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form-container">
                    <div class="text-center mb-4">
                        <div class="option-icon mx-auto mb-3" style="background: #38bdf8; color: white; width: 60px; height: 60px; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
                            ⚽
                        </div>
                        <h2 class="text-white fw-bold">Modificar Equipo</h2>
                        <p class="text-white-50">Introduce el nombre del equipo para editar sus datos</p>
                    </div>

                    <form id="searchTeamForm">
                        <div class="mb-4">
                            <label class="form-label text-info">Nombre del Equipo</label>
                            <input type="text" class="form-control form-control-lg" id="teamNameInput" placeholder="Ej: FC Barcelona" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                                Buscar Equipo
                            </button>
                            <a href="Team_Management_Screen.html" class="btn btn-outline-secondary">
                                Volver a Gestión de Equipos
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Team Search Logic
         * Only "FC Barcelona" exists in this simulation.
         */
        const searchForm = document.getElementById('searchTeamForm');

        searchForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const teamName = document.getElementById('teamNameInput').value.trim().toLowerCase();
            
            // Simulación: El único equipo que existe es el Barça
            const targetTeam = "fc barcelona";
            const targetPage = "EditTeamBarcelona.html"; // Esta es la página que deberás crear

            console.log("Searching for team: " + teamName);

            if (teamName === targetTeam) {
                Swal.fire({
                    title: '¡Equipo Encontrado!',
                    text: 'Abriendo el panel de edición del FC Barcelona...',
                    icon: 'success',
                    background: '#1e293b',
                    color: '#ffffff',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    // Redirección a la página de edición del Barcelona
                    window.location.href = targetPage;
                });
            } else {
                Swal.fire({
                    title: 'No encontrado',
                    text: 'El equipo "' + teamName + '" no está registrado en el sistema.',
                    icon: 'error',
                    background: '#1e293b',
                    color: '#ffffff',
                    confirmButtonColor: '#38bdf8'
                });
            }
        });
    </script>
</body>
</html>
