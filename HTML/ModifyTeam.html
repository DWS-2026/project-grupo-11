<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Equipos - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="form-container" style="max-width: 900px;">
            <div class="text-center mb-4">
                <h2 class="text-white fw-bold">Gestión de Equipos</h2>
                <p class="text-white-50">Equipos participantes en la Liga Pro</p>
            </div>

            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle border-secondary">
                    <thead class="text-info">
                        <tr>
                            <th>Escudo</th>
                            <th>Nombre del Equipo</th>
                            <th>Estadio</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="teamTableBody">
                        <tr>
                            <td>
                                <img src="../images/logo_barcelona.jpg" 
                                     alt="Barça Logo" style="width: 45px; height: 45px; object-fit: contain;">
                            </td>
                            <td class="text-white fw-bold">FC Barcelona</td>
                            <td class="text-white-50">Spotify Camp Nou</td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <button class="btn btn-sm btn-warning" onclick="editTeam('EditTeamBarcelona.html')">
                                        Editar
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteTeam('FC Barcelona')">
                                        Borrar
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-grid gap-2 mt-4">
                <a href="Team_Management_Screen.html" class="btn btn-outline-secondary">
                    Volver a Gestión de Equipos
                </a>
            </div>
        </div>
    </div>

    <script>
        /**
         * Team management actions.
         * Functions named in English for code quality evaluation.
         */
        
        function editTeam(page) {
            Swal.fire({
                title: 'Abriendo editor...',
                background: '#1e293b',
                color: '#ffffff',
                timer: 800,
                showConfirmButton: false,
                didOpen: () => { Swal.showLoading(); }
            }).then(() => {
                window.location.href = page;
            });
        }

        function deleteTeam(teamName) {
            Swal.fire({
                title: '¿Eliminar equipo?',
                text: `Estás a punto de borrar al ${teamName} de la liga.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar',
                background: '#1e293b',
                color: '#ffffff'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: 'Eliminado',
                        text: 'El equipo ha sido dado de baja correctamente.',
                        icon: 'success',
                        background: '#1e293b',
                        color: '#ffffff'
                    });
                    // Log in English for debugging
                    console.log("Entity Team: " + teamName + " deleted.");
                }
            });
        }
    </script>

    <footer class="footer bg-light text-center py-3 mt-5">
        <div class="container">
            <span class="text-muted">
                © 2026 LigaApp · Proyecto académico
            </span>
        </div>
    </footer>
</body>
</html>
