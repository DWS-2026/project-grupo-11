<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Options - FootLeague</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="mb-4">
            <h1 class="h4 mb-0 text-white">Admin Panel</h1>
            <small class="text-white-50">Selecciona una tarjeta para gestionar</small>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="card option-card p-3" data-option="manage-users" role="button">
                    <div class="d-flex align-items-center">
                        <div class="me-3 option-icon">👥</div>
                        <div>
                            <h5 class="mb-1">Modificar Cuentas</h5>
                            <p class="mb-0 text-muted">Gestión de usuarios.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card option-card p-3" data-option="manage-matchs" role="button">
                    <div class="d-flex align-items-center">
                        <div class="me-3 option-icon">📅</div>
                        <div>
                            <h5 class="mb-1">Modificar Partidos</h5>
                            <p class="mb-0 text-muted">Resultados y jornadas.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card option-card p-3" data-option="manage-teams" role="button">
                    <div class="d-flex align-items-center">
                        <div class="me-3 option-icon">⚽</div>
                        <div>
                            <h5 class="mb-1">Modificar Equipos</h5>
                            <p class="mb-0 text-muted">Plantillas y escudos.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card option-card p-3" data-option="return-home" role="button">
                    <div class="d-flex align-items-center">
                        <div class="me-3 option-icon">🏠</div>
                        <div>
                            <h5 class="mb-1">Regresar</h5>
                            <p class="mb-0 text-muted">Volver al inicio.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Diccionario de rutas para navegación directa
        const paths = {
            'manage-users': 'Pantalla_Gestion_Cuentas.html',
            'manage-matchs': 'Pantalla_Gestion_Partidos.html',
            'manage-teams': 'Pantalla_Gestion_Equipos.html',
            'return-home': '../index.html'
        };

        // Evento de clic directo sin alertas
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', () => {
                const option = card.getAttribute('data-option');
                
                // Redirección inmediata
                if (paths[option]) {
                    window.location.href = paths[option];
                }
            });
        });
    </script>
</body>
</html>
