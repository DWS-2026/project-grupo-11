<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partidos - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg">
        <div class="container justify-content-end">
            <div class="d-flex gap-2">
                <a href="login.html" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
                <a href="registration.html" class="btn btn-primary btn-sm" id="continueBtn">Registrarse</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            
            <div class="col-md-6 mb-4">
                <div class="mb-4 text-center">
                    <h1 class="h2 mb-0 text-white fw-bold">Próximos Partidos</h1>
                    <small class="text-white-50">Temporada 2026</small>
                </div>

                <div class="card option-card p-3" data-option="match-future" role="button">
                    <div class="d-flex align-items-center justify-content-between text-center">
                        <div style="width: 35%;">
                            <img src="../images/logo_atleti.jpg" alt="Atleti" class="mb-2" style="width: 45px; height: 45px; object-fit: contain;">
                            <h6 class="mb-0 text-white">Atlético</h6>
                        </div>

                        <div style="width: 30%;">
                            <div class="text-info fw-bold mb-0">15 FEB</div>
                            <small class="text-white-50 d-block">21:00</small>
                            <small class="text-white-50 d-block"><i class="bi bi-geo-alt"></i> Wanda Metropolitano</small>
                        </div>

                        <div style="width: 30%;">
                            <img src="../images/logo_sevilla.png" alt="Sevilla" class="mb-2" style="width: 45px; height: 45px; object-fit: contain;">
                            <h6 class="mb-0 text-white">Sevilla FC</h6>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="mb-4 text-center">
                    <h1 class="h4 mb-0 text-white fw-bold">Resultados Recientes</h1>
                    <small class="text-white-50">Historial de encuentros</small>
                </div>
                
                <div class="card option-card p-3" data-option="match-1" role="button">
                    <div class="d-flex align-items-center justify-content-between">
                        <div style="width: 35%;">
                            <img src="../images/logo_realMadrid.png"
                                alt="Logo Real Madrid" class="mb-2"
                                style="width: 45px; height: 45px; object-fit: contain;">
                            <h6 class="mb-0 text-white">Real Madrid</h6>
                        </div>

                        <div style="width: 30%;">
                            <div class="text-white fw-bold h4 mb-0">2 - 1</div>
                            <small class="text-muted d-block">01 FEB 2026</small>
                            <small class="text-white-50 d-block"><i class="bi bi-geo-alt"></i> Santiago Bernabéu</small>
                        </div>

                        <div style="width: 35%;">
                            <img src="../images/logo_barcelona.jpg"
                                alt="FC Barcelona" class="mb-2"
                                style="width: 45px; height: 45px; object-fit: contain;">
                            <h6 class="mb-0 text-white">FC Barcelona</h6>
                        </div>
                    </div>
                </div>
            </div>
        </div> <div class="row g-3 mt-2">
            <div class="col-6">
                <div class="card option-card p-3 text-center" data-option="go-login">
                    <h6 class="text-white mb-0 small">¿Ya tienes cuenta?</h6>
                    <small class="text-muted">Login</small>
                </div>
            </div>
            <div class="col-6">
                <div class="card option-card p-3 text-center" data-option="go-register">
                    <h6 class="text-white mb-0">¿Eres nuevo?</h6>
                    <small class="text-muted">Registro</small>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Updated paths for navigation
        const navigationPaths = {
            'match-1': 'match-details.html',
            'go-login': 'login.html',
            'go-register': 'registration.html'
        };

        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', () => {
                const option = card.getAttribute('data-option');
                if (navigationPaths[option]) {
                    window.location.href = navigationPaths[option];
                }
            });
        });
    </script>
</body>

</html>
