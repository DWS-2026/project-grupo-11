<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partidos - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg">
        <div class="container justify-content-end">
            <div class="d-flex gap-2">
                <a href="login.html" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
                <a href="registration.html" class="btn btn-primary btn-sm" id="continueBtn">Registrarse</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="mb-4 text-center">
            <h1 class="h2 mb-0 text-white fw-bold">Próximos Partidos</h1>
            <small class="text-white-50">Temporada 2026</small>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="card option-card p-3" data-option="match-1" role="button">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center">
                            <div class="me-3 option-icon">⚽</div>
                            <div>
                                <h5 class="mb-1">Real Madrid vs FC Barcelona</h5>
                                <p class="mb-0 text-muted">Jornada 22 - Finalizado</p>
                            </div>
                        </div>
                        <div class="text-white fw-bold h4 mb-0">2 - 1</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3 mt-4">
            <div class="col-6">
                <div class="card option-card p-3 text-center" data-option="go-login">
                    <h6 class="text-white mb-0">¿Ya tienes cuenta?</h6>
                    <small class="text-muted">Login</small>
                </div>
            </div>
            <div class="col-6">
                <div class="card option-card p-3 text-center" data-option="go-register">
                    <h6 class="text-white mb-0">¿Eres nuevo?</h6>
                    <small class="text-muted">Registro</small>
                </div>
            </div>
        </div>

        <div class="mt-5 text-center">
            <a href="player-ratings.html" class="btn btn-primary" id="continueBtn">Valorar Jugadores</a>
        </div>
    </div>

    <script>
        // Updated paths for navigation
        const navigationPaths = {
            'match-1': 'match-details.html',
            'go-login': 'login.html',
            'go-register': 'registration.html'
        };

        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', () => {
                const option = card.getAttribute('data-option');
                if (navigationPaths[option]) {
                    window.location.href = navigationPaths[option];
                }
            });
        });
    </script>
</body>
</html>
