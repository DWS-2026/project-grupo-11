<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Periodistas - Liga Pro</title>

     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Common styles -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm" style="max-width: 400px; width: 100%;">
        <div class="card-body p-5">
            <h2 class="mb-4 text-center text-primary">Iniciar Sesión</h2>

            <form action="profile.html" class="mt-4">

                <div class="mb-3">
                    <label for="email" class="form-label text-primary">Correo electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="nombre@ejemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label text-primary">Contraseña</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                    Entrar
                </button>

                <p class="mt-4 text-center small">
                    ¿No tienes cuenta? 
                    <a href="registration.html" class="text-decoration-none">Regístrate aquí</a>
                </p>

                <div class="text-center mt-2">
                    <a href="index.html" class="text-muted small text-decoration-none">← Volver al inicio</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
