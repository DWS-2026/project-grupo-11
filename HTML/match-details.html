<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detalle - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="form-container">
            <h1 class="h4 text-white text-center mb-4">Resumen del Encuentro</h1>

            <div class="text-center mb-5 p-4 rounded" style="background: rgba(255,255,255,0.02)">
                <div class="row align-items-center">
                    <div class="col text-white">
                        <img src="../images/logo_realMadrid.png"
                            alt="Real Madrid" class="mb-3" style="width: 80px; height: 80px; object-fit: contain;">
                        <h5>Real Madrid</h5>
                    </div>

                    <div class="col text-info">
                        <h1 class="display-2 fw-bold mb-0">2 - 1</h1>
                        <span class="badge bg-success">Finalizado</span>
                    </div>

                    <div class="col text-white">
                        <img src="../images/logo_barcelona.jpg"
                            alt="FC Barcelona" class="mb-3" style="width: 80px; height: 80px; object-fit: contain;">
                        <h5>FC Barcelona</h5>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <h6 class="text-white-50 mb-3">Sucesos del Partido</h6>
                <div class="card option-card p-2 mb-2">
                    <small class="text-white">⚽ 23' - Gol de Vinícius Jr.</small>
                </div>
                <div class="card option-card p-2 mb-2">
                    <small class="text-white">🟨 40' - Tarjeta para Gavi</small>
                </div>
                <div class="card option-card p-2 mb-2">
                    <small class="text-white">⚽ 89' - Gol de Bellingham</small>
                </div>
            </div>

            <div class="d-grid gap-2 mt-4">
                <a href="player-ratings.html" class="btn btn-primary" id="continueBtn">Valorar Actuación</a>
                <a href="index.html" class="btn btn-return text-center py-2">Volver</a>
            </div>
        </div>
    </div>
</body>

</html>
