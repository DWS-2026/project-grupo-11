<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listado de Partidos - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="index.html">FootLeague</a>
            <div class="d-flex gap-2">
                <a href="index.html" class="btn btn-outline-light btn-sm">← Volver a Home</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="mb-5 text-center">
            <h1 class="h2 mb-0 text-white fw-bold">Calendario de Partidos</h1>
            <small class="text-white-50">Temporada 2026 - Todos los encuentros</small>
        </div>

        <div class="row g-3">
            
            <div class="col-md-10 mx-auto">
                <div class="card option-card p-4">
                    <div class="row align-items-center">
                        <div class="col-4 text-center text-white">
                            <img src="../images/logo_realMadrid.png" alt="Real Madrid" class="mb-2 d-block mx-auto" style="width: 45px; height: 45px; object-fit: contain;">
                            <h6 class="mb-0">Real Madrid</h6>
                        </div>

                        <div class="col-4 text-center">
                            <div class="text-white fw-bold h3 mb-0">2 - 1</div>
                            <span class="badge bg-success mb-2">Finalizado</span>
                            <small class="text-white-50 d-block">01 FEB 2026</small>
                        </div>

                        <div class="col-4 text-center text-white">
                            <img src="../images/logo_barcelona.jpg" alt="Barça" class="mb-2 d-block mx-auto" style="width: 45px; height: 45px; object-fit: contain;">
                            <h6 class="mb-0">FC Barcelona</h6>
                        </div>
                    </div>
                    
                    <div class="mt-3 text-center border-top pt-3 border-secondary">
                        <a href="match-details.html" class="btn btn-primary btn-sm px-4">Ver detalle del partido</a>
                    </div>
                </div>
            </div>

            <div class="col-md-10 mx-auto">
                <div class="card option-card p-4">
                    <div class="row align-items-center">
                        <div class="col-4 text-center text-white">
                            <img src="../images/logo_atleti.jpg" alt="Atleti" class="mb-2 d-block mx-auto" style="width: 45px; height: 45px; object-fit: contain;">
                            <h6 class="mb-0">Atlético</h6>
                        </div>

                        <div class="col-4 text-center">
                            <div class="text-info fw-bold h4 mb-0">VS</div>
                            <small class="text-warning d-block fw-bold mt-1">15 FEB 2026</small>
                            <small class="text-white-50">21:00h</small>
                        </div>

                        <div class="col-4 text-center text-white">
                            <img src="../images/logo_sevilla.png" alt="Sevilla" class="mb-2 d-block mx-auto" style="width: 45px; height: 45px; object-fit: contain;">
                            <h6 class="mb-0">Sevilla FC</h6>
                        </div>
                    </div>
                    
                    <div class="mt-3 text-center border-top pt-3 border-secondary">
                        <button class="btn btn-outline-light btn-sm px-4" disabled>Detalles no disponibles</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
