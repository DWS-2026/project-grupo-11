<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Valoraciones - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="form-container">
            <h1 class="h4 text-white text-center mb-4">Valorar Jugador</h1>
            
            <form>
                <div class="mb-3">
                    <label class="form-label">Seleccionar Jugador</label>
                    <select class="form-control search-box">
                        <option>Vinícius Jr.</option>
                        <option>Jude Bellingham</option>
                        <option>Lewandowski</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Puntuación (1-5)</label>
                    <input type="range" class="form-range" min="1" max="5" id="playerRating">
                </div>

                <div class="mb-4">
                    <label class="form-label">Comentario</label>
                    <textarea class="form-control search-box" rows="3" placeholder="Tu opinión técnica..."></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary" id="continueBtn">Enviar Valoración</button>
                    <a href="index.html" class="btn btn-return text-center py-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
