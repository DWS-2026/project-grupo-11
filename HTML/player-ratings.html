<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valoración de Jugadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">Liga Proyect</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Partidos</a>
                <a class="nav-link active" href="player-ratings.html">Valorar</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm rating-container">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0">Sistema de Valoración</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="player-rating-form">
                            <div class="mb-4">
                                <label for="player-select" class="form-label fw-bold">Selecciona un Jugador</label>
                                <select class="form-select form-control-lg" id="player-select" name="player-id">
                                    <option value="1">Vinícius Jr. (Real Madrid)</option>
                                    <option value="2">Jude Bellingham (Real Madrid)</option>
                                    <option value="3">Robert Lewandowski (FC Barcelona)</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Puntuación (1 al 5)</label>
                                <div class="rating-options d-flex justify-content-between px-2">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="score" id="score1" value="1">
                                        <label class="form-check-label" for="score1">1</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="score" id="score2" value="2">
                                        <label class="form-check-label" for="score2">2</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="score" id="score3" value="3">
                                        <label class="form-check-label" for="score3">3</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="score" id="score4" value="4">
                                        <label class="form-check-label" for="score4">4</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="score" id="score5" value="5" checked>
                                        <label class="form-check-label" for="score5">5</label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="review-text" class="form-label fw-bold">Comentario sobre la actuación</label>
                                <textarea class="form-control" id="review-text" name="comment" rows="3" placeholder="Escribe aquí tu opinión..."></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg submit-btn">Enviar Valoración</button>
                                <a href="index.html" class="btn btn-outline-secondary">Volver al inicio</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
