<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de periodista - Liga de fútbol</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Common styles -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ FootLeague 2026</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="login.html">Iniciar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0">Registro de Periodista</h4>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted text-center mb-4">Únete a la plataforma para valorar a tus jugadores favoritos.</p>
                        
                        <form action="profile.html">
                            <div class="mb-3">
                                <label class="form-label text-primary">Nombre Completo</label>
                                <input type="text" class="form-control" placeholder="Ej. Juan Pérez" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label text-primary">Correo Electrónico</label>
                                <input type="email" class="form-control" placeholder="nombre@ejemplo.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-primary">Contraseña</label>
                                <input type="password" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-primary">Confirmar Contraseña</label>
                                <input type="password" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-primary">Foto de Perfil (Avatar)</label>
                                <input class="form-control" type="file" id="formFile">
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-primary">Equipo Favorito</label>
                                <select class="form-select" required>
                                    <option selected disabled>Selecciona un equipo...</option>
                                    <option value="1">Real Madrid CF</option>
                                    <option value="2">FC Barcelona</option>
                                    <option value="3">Atlético de Madrid</option>
                                </select>
                                <div class="form-text">Esto determinará sobre qué equipo podrás ejercer como periodista.</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Crear Cuenta</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center py-3">
                        ¿Ya tienes cuenta? <a href="login.html" class="text-decoration-none">Inicia sesión aquí</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <footer class="footer bg-light text-center py-3 mt-5">
        <div class="container">
            <span class="text-muted">
                © 2026 LigaApp · Proyecto académico
            </span>
        </div>
    </footer>

</body>
</html>
