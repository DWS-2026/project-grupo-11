        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/v1/ratings:
    get:
      tags:
      - rating-rest-controller
      operationId: getAllRatings
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageRatingDTO"
  /api/v1/events:
    get:
      tags:
      - match-event-rest-controller
      operationId: getAllMatchEvents
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageMatchEventDTO"
components:
  schemas:
    Team:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        stadiumName:
          type: string
        points:
          type: integer
          format: int32
        playedMatchs:
          type: integer
          format: int32
        wins:
          type: integer
          format: int32
        draws:
          type: integer
          format: int32
        losses:
          type: integer
          format: int32
        logoData:
          type: object
          properties:
            binaryStream: {}
        playedMatches:
          type: integer
          format: int32
    TeamDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        stadiumName:
          type: string
        points:
          type: integer
          format: int32
    RatingDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        score:
          type: integer
          format: int32
          maximum: 10
          minimum: 1
        comment:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        authorUsername:
          type: string
        authorId:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
      required:
      - comment
      - eventId
      - score
    Match:
      type: object
      properties:
        id:
          type: integer
          format: int64
        localTeam:
          $ref: "#/components/schemas/Team"
        visitorTeam:
          $ref: "#/components/schemas/Team"
        localGoals:
          type: integer
          format: int32
        visitorGoals:
          type: integer
          format: int32
        weather:
          type: string
        stadium:
          type: string
        matchDate:
          type: string
          format: date
        matchTime:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/MatchEvent"
        played:
          type: boolean
        climaLluvia:
          type: boolean
        climaDespejado:
          type: boolean
        climaViento:
          type: boolean
        climaNublado:
          type: boolean
        finalized:
          type: boolean
        climaNieve:
          type: boolean
    MatchEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        minute:
          type: integer
          format: int32
        type:
          type: string
        namePlayer:
          type: string
        namePlayerOut:
          type: string
        namePlayerIn:
          type: string
        match:
          $ref: "#/components/schemas/Match"
        team:
          $ref: "#/components/schemas/Team"
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/Rating"
        icon:
          type: string
        description:
          type: string
        isGoal:
          type: boolean
        isLocal:
          type: boolean
        isRed:
          type: boolean
        isYellow:
          type: boolean
        isVisitor:
          type: boolean
        isSubstitution:
          type: boolean
    Rating:
      type: object
      properties:
        id:
          type: integer
          format: int64
        score:
          type: integer
          format: int32
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        author:
          $ref: "#/components/schemas/User"
        event:
          $ref: "#/components/schemas/MatchEvent"
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        avatarData:
          type: object
          properties:
            binaryStream: {}
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/Rating"
        favouriteTeam:
          $ref: "#/components/schemas/Team"
        password:
          type: string
    MatchDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        localTeamName:
          type: string
        visitorTeamName:
          type: string
        localGoals:
          type: integer
          format: int32
        visitorGoals:
          type: integer
          format: int32
        stadium:
          type: string
        date:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/MatchEventDTO"
    MatchEventDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        minute:
          type: integer
          format: int32
          maximum: 120
          minimum: 0
        type:
          type: string
          minLength: 1
        namePlayer:
          type: string
        namePlayerOut:
          type: string
        namePlayerIn:
          type: string
        matchId:
          type: integer
          format: int64
        teamId:
          type: integer
          format: int64
        teamName:
          type: string
      required:
      - matchId
      - minute
      - teamId
      - type
    UserRegistrationDTO:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        favouriteTeamId:
          type: integer
          format: int64
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        favouriteTeamId:
          type: integer
          format: int64
        roles:
          type: array
          items:
            type: string
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageTeamDTO:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/TeamDTO"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    PageRatingDTO:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/RatingDTO"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
    PageMatchDTO:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/MatchDTO"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
    PageMatchEventDTO:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/MatchEventDTO"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
