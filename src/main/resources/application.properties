spring.application.name=FootLeague
spring.mustache.suffix=.html
# This makes Hibernate print the SQL queries in a more readable format
spring.jpa.properties.hibernate.format_sql=true
# This enables logging of the SQL statements generated by Hibernate, 
# which is very useful for debugging and understanding what queries are being executed.
logging.level.org.hibernate.SQL=DEBUG
# This shows the actual data that is saved (names, IDs, etc.)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# --- CONNECTION TO MYSQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/footleague?serverTimezone=UTC
spring.datasource.username=root
# IMPORTANT! Now that we have a password, we need to set it here.
spring.datasource.password=Admin123_
# --- TABLE MANAGEMENT ---
# 'create-drop' means that Hibernate will create the database schema 
#when the application starts and drop it when the application stops.
# It's very useful for development because it ensures you always start with a clean database,
# but be careful: it will delete all your data when you stop the app!
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Adjusting the maximum file size for uploads (e.g., team logos, player photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Use port 8443 for HTTPS. This requires setting up an SSL certificate,
# which we will do next.
server.port=8443

# Configuration for SSL. We will use a self-signed certificate for development purposes.
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=admin123_
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot