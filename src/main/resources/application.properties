spring.application.name=FootLeague
spring.mustache.suffix=.html
# Esto hace que las consultas SQL se vean bonitas y legibles en la consola
spring.jpa.properties.hibernate.format_sql=true
# Esto muestra las consultas SQL que hace Java
logging.level.org.hibernate.SQL=DEBUG
# Esto muestra los datos reales que se guardan (nombres, IDs, etc.)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# --- CONEXIÓN A MYSQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/footleague?serverTimezone=UTC
spring.datasource.username=root
# ¡OJO! Aquí pon la contraseña que elegiste en la instalación de MySQL
spring.datasource.password=Admin123_
# --- GESTIÓN DE TABLAS ---
# 'create-drop' significa: crea las tablas al empezar y BÓRRALAS al cerrar.
# Es perfecto para clase porque siempre empiezas de limpio.
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Ajusta según necesites
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Usa el puerto 8443 para HTTPS
server.port=8443

# Configuración del certificado que acabas de crear
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=admin123_
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot