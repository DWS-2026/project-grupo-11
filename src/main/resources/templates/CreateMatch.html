{{>fragments/header}}
<div class="form-container container mt-4">
    <h2 class="text-center mb-4 text-white">
        {{#match.id}}Editar{{/match.id}}{{^match.id}}Registrar{{/match.id}} Partido y Sucesos
    </h2>

    <form id="createMatchForm" action="/match/save" method="post">
    
        {{#match.id}}
            <input type="hidden" name="id" id="matchId" value="{{match.id}}">
        {{/match.id}}

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label text-info">Equipo Local</label>
                <select id="homeTeam" class="form-select bg-dark text-white border-info" name="localTeam" required>
                    <option value="" disabled selected>Seleccione equipo local...</option>
                    {{#teamList}}
                        <option value="{{id}}">{{name}}</option>
                    {{/teamList}}
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label text-info">Equipo Visitante</label>
                <select id="awayTeam" class="form-select bg-dark text-white border-info" name="visitorTeam" required>
                    <option value="" disabled selected>Seleccione equipo visitante...</option>
                    {{#teamList}}
                        <option value="{{id}}">{{name}}</option>
                    {{/teamList}}
                </select>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <label class="form-label text-info">Fecha</label>
                <input type="date" id="matchDate" class="form-control" name="matchDate" value="{{#match.matchDate}}{{match.matchDate}}{{/match.matchDate}}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label text-info">Hora de inicio</label>
                <input type="time" id="matchTime" class="form-control" name="matchTime" value="{{#match.matchTime}}{{match.matchTime}}{{/match.matchTime}}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label text-info">Temporal (Clima)</label>
                <select id="weather" class="form-select" name="weather" required>
                    <option value="Despejado" {{#climaDespejado}}selected{{/climaDespejado}}>☀️ Despejado</option>
                    <option value="Nublado" {{#climaNublado}}selected{{/climaNublado}}>☁️ Nublado</option>
                    <option value="Lluvia" {{#climaLluvia}}selected{{/climaLluvia}}>🌧️ Lluvia</option>
                    <option value="Nieve" {{#climaNieve}}selected{{/climaNieve}}>❄️ Nieve</option>
                    <option value="Viento" {{#climaViento}}selected{{/climaViento}}>💨 Viento</option>
                </select>
            </div>
        </div>
        <div class="mt-4">
            <h4 class="text-info border-bottom border-info pb-2">Eventos del Partido</h4>
            <div id="eventsContainer">
                {{#match.events}}
                <div class="row g-2 mb-2 event-row">
                    <div class="col-md-2">
                        <input type="number" class="form-control event-minute" value="{{minute}}" placeholder="Min">
                    </div>
                    <div class="col-md-3">
                        <select class="form-select event-type">
                            <option value="GOAL" {{#isGoal}}selected{{/isGoal}}>⚽ Gol</option>
                            <option value="YELLOW CARD" {{#isYellow}}selected{{/isYellow}}>🟨 Tarjeta</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <input type="text" class="form-control event-player" value="{{namePlayer}}" placeholder="Nombre Apellido (Nº)">
                    </div>
                        <div class="col-md-1">
                            <button type="button" class="btn btn-danger" onclick="removeEvent(this)">×</button>
                        </div>
                    </div>
                {{/match.events}}
            </div>
            <button type="button" class="btn btn-outline-info btn-sm mt-2" onclick="addEventField()">
                + Añadir Evento (Gol, Tarjeta, etc.)
            </button>
        </div>

        <template id="eventTemplate">
            <div class="row g-2 mb-2 event-row align-items-end">
                <div class="col-md-2">
                    <label class="small text-white-50">Minuto</label>
                    <input type="number" class="form-control form-control-sm event-minute" placeholder="Min" min="1" max="120" required>
                </div>
                <div class="col-md-3">
                    <label class="small text-white-50">Tipo</label>
                    <select class="form-select form-select-sm event-type" onchange="calculateScore()">
                        <option value="GOAL">⚽ Gol</option>
                        <option value="YELLOW CARD">🟨 Tarjeta Amarilla</option>
                        <option value="RED_CARD">🟥 Tarjeta Roja</option>
                        <option value="SUBSTITUTION">🔄 Cambio</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="small text-white-50">Jugador (Nombre Apellido (Nº))</label>
                    <input type="text" class="form-control form-control-sm event-player" placeholder="Ej: Lionel Messi (10)" required>
                </div>
                <div class="col-md-2">
                    <label class="small text-white-50">Equipo</label>
                    <select class="form-select form-select-sm event-team">
                        <option value="LOCAL">Local</option>
                        <option value="VISITOR">Visitante</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button type="button" class="btn btn-danger btn-sm" onclick="removeEvent(this)">×</button>
                </div>
            </div>
        </template>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary p-3 fw-bold">Guardar Partido</button>
            <a href="/match-list" class="btn btn-secondary py-2">Cancelar</a>
        </div>
    </form>
</div>

{{>fragments/footer}}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/match_logic.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
