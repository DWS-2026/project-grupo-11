{{>fragments/header}}

<div class="form-container container mt-4">
    <div class="text-center mb-4">
        <img src="{{#team.logoBase64}}data:image/png;base64,{{team.logoBase64}}{{/team.logoBase64}}{{^team.logoBase64}}/images/default-logo.png{{/team.logoBase64}}"
             alt="Logo" style="width: 80px; height: 80px; object-fit: contain;" class="mb-3">
        
        <h2 class="text-white">Modificar {{team.name}}</h2>
    </div>

    <form id="editTeamForm">
        <input type="hidden" id="teamId" value="{{team.id}}">

        <div class="mb-3">
            <label class="form-label text-info">Nombre del Equipo</label>
            <input type="text" class="form-control bg-dark text-white" id="teamName" value="{{team.name}}" required>
        </div>

        <div class="mb-3">
            <label class="form-label text-info">Estadio</label>
            <input type="text" class="form-control bg-dark text-white" id="stadiumName" value="{{team.stadiumName}}" required>
        </div>

        <div class="mb-4">
            <label class="form-label text-info">Actualizar Logo</label>
            <input type="file" class="form-control bg-dark text-white" id="teamLogo" accept="image/*">
            <small class="text-white-50">Deja vacío si no quieres cambiar el logo actual.</small>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-warning p-3 fw-bold">Guardar Cambios</button>
            <a href="/teams" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const editForm = document.getElementById('editTeamForm');

    editForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const teamId = document.getElementById('teamId').value;
        const teamName = document.getElementById('teamName').value;
        const stadiumName = document.getElementById('stadiumName').value;
        const logoFile = document.getElementById('teamLogo').files[0];

        const formData = new FormData();
        // IMPORTANTE: Incluimos el ID para que el Controller sepa que es una actualización
        formData.append('id', teamId); 
        formData.append('name', teamName);
        formData.append('stadiumName', stadiumName);
        
        if (logoFile) {
            formData.append('logoFile', logoFile);
        }

        try {
            // CAMBIO: Enviamos a /teams/save mediante POST (el estándar de los Controllers de vista)
            const response = await fetch(`/teams/save`, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                Swal.fire({
                    title: '¡Actualizado!',
                    text: `Los cambios en ${teamName} se han guardado con éxito.`,
                    icon: 'success',
                    background: '#1e293b',
                    color: '#ffffff',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    // Redirigimos a la ruta del controlador de la lista
                    window.location.href = '/teams';
                });
            } else {
                throw new Error('Failed to update team');
            }
        } catch (error) {
            console.error("Error updating team:", error);
            Swal.fire({
                title: 'Error',
                text: 'No se pudo actualizar el equipo.',
                icon: 'error',
                background: '#1e293b',
                color: '#ffffff'
            });
        }
    });
</script>

{{>fragments/footer}}
