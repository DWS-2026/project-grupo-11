{{>fragments/header}}

<div class="form-container container mt-4">
    <div class="text-center mb-4">
        <img src="/team/{{team.id}}/logo"
             alt="Logo" style="width: 80px; height: 80px; object-fit: contain;" class="mb-3" onerror="this.src='/images/default-logo.svg'">
        
        <h2 class="text-white">Modificar {{team.name}}</h2>
    </div>

    <form id="editTeamForm">
        <input type="hidden" name="_csrf" value="{{token}}"/>
        <input type="hidden" id="teamId" value="{{team.id}}">

        <div class="mb-3">
            <label class="form-label text-info">Nombre del Equipo</label>
            <input type="text" class="form-control bg-dark text-white" id="teamName" value="{{team.name}}" required>
        </div>

        <div class="mb-3">
            <label class="form-label text-info">Estadio</label>
            <input type="text" class="form-control bg-dark text-white" id="stadiumName" value="{{team.stadiumName}}" required>
        </div>

        <div class="mb-4">
            <label class="form-label text-info">Actualizar Logo</label>
            <input type="file" class="form-control bg-dark text-white" id="teamLogo" accept="image/*">
            <small class="text-white-50">Deja vacío si no quieres cambiar el logo actual.</small>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-warning p-3 fw-bold">Guardar Cambios</button>
            <a href="/admin/teams/list-teams" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/js/edit_team.js"></script>

{{>fragments/footer}}
