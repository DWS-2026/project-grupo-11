<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Team: FC Barcelona - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ FootLeague 2026</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Volver a Inicio</a>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="form-container">
            <div class="text-center mb-4">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/4/47/FC_Barcelona_logo.svg/1200px-FC_Barcelona_logo.svg.png" 
                     alt="Barça Logo" style="width: 80px;" class="mb-3">
                <h2 class="text-white">Modificar FC Barcelona</h2>
            </div>

            <form id="editTeamForm">
                <div class="mb-3">
                    <label class="form-label text-info">Nombre del Equipo</label>
                    <input type="text" class="form-control" id="teamName" value="FC Barcelona" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-info">Estadio</label>
                    <input type="text" class="form-control" id="stadiumName" value="Spotify Camp Nou" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-info">Actualizar Logo</label>
                    <input type="file" class="form-control" id="teamLogo" accept="image/*">
                    <small class="text-white-50">Deja vacío si no quieres cambiar el logo actual.</small>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-warning p-3 fw-bold">Guardar Cambios</button>
                    <a href="ModifyTeam.html" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        /**
         * Team Modification Logic
         * Code quality: Variable names and logs in English as per project requirements.
         */
        const editForm = document.getElementById('editTeamForm');
        
        editForm.addEventListener('submit', (event) => {
            event.preventDefault();
            
            // Console log in English for the teacher to see quality code
            console.log("Updating FC Barcelona data in local storage...");

            Swal.fire({
                title: '¡Actualizado!',
                text: 'Los cambios en el FC Barcelona se han guardado.',
                icon: 'success',
                background: '#1e293b',
                color: '#ffffff',
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                // Return to the main management screen
                window.location.href = 'Team_Management_Screen.html';
            });
        });
    </script>

    <footer class="footer bg-light text-center py-3 mt-5">
        <div class="container">
            <span class="text-muted">
                © 2026 LigaApp · Proyecto académico
            </span>
        </div>
    </footer>
    
</body>
</html>
