{{>fragments/header}}

<h1 class="mb-4 text-white text-center">Administración de Partidos</h1>

<div class="row g-4 justify-content-center">
    <div class="col-md-5">
        <div class="card option-card h-100 p-3">
            <div class="card-body text-center">
                <div class="option-icon mb-3"
                    style="background: linear-gradient(180deg,#bbf7d0,#10b981); color: #04201a; width: 60px; height: 60px; line-height: 60px; border-radius: 50%; margin: 0 auto; font-size: 1.5rem;">
                    ➕
                </div>
                <h5 class="card-title text-white">Crear Partido</h5>
                <p class="card-text text-white-50">Registra un nuevo encuentro y sus sucesos (goles, tarjetas...)</p>
                <button class="btn btn-primary w-100 mt-3 fw-bold" onclick="navigateTo('/admin/matches/match-create')">Crear Nuevo</button>
            </div>
        </div>
    </div>

    <div class="col-md-5">
        <div class="card option-card h-100 p-3">
            <div class="card-body text-center">
                <div class="option-icon mb-3"
                    style="background: linear-gradient(180deg,#fef08a,#f59e0b); color: #2b1500; width: 60px; height: 60px; line-height: 60px; border-radius: 50%; margin: 0 auto; font-size: 1.5rem;">
                    📋
                </div>
                <h5 class="card-title text-white">Gestionar Partidos</h5>
                <p class="card-text text-white-50">Ver listado de encuentros para editar resultados o eliminar registros</p>
                <button class="btn btn-warning w-100 mt-3 fw-bold" onclick="navigateTo('/admin/matches/modify-match')">Ir al Listado</button>
            </div>
        </div>
    </div>
</div>

<div class="mt-5 text-center">
    <a href="/admin/admin-page" class="btn btn-outline-secondary">Volver al Panel Principal</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    /**
     * Navigation logic
     * Ahora redirige a rutas controladas por Spring
     */
    function navigateTo(url) {
        window.location.href = url;
    }
</script>

{{>fragments/footer}}
