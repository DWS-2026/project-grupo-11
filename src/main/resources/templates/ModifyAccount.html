<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Usuarios - FootLeague</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ FootLeague 2026</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Volver a Inicio</a>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="form-container" style="max-width: 900px;">
            <div class="text-center mb-4">
                <h2 class="text-white fw-bold">Gestión de Usuarios</h2>
                <p class="text-white-50">Lista de periodistas registrados en el sistema</p>
            </div>

            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle border-secondary">
                    <thead class="text-info">
                        <tr>
                            <th>Avatar</th>
                            <th>Nombre y Apellidos</th>
                            <th>Correo Electrónico</th>
                            <th>Equipo</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td>
                               <img src="../images/Juan_Perez_Avatar.PNG" 
                                     alt="Jaun perez" style="width: 45px; height: 45px; object-fit: contain;">
                            </td>
                            </td>
                            <td class="text-white">Juan Pérez</td>
                            <td class="text-white-50">juan.perez@prensa.com</td>
                            <td><span class="badge bg-primary">Real Madrid FC</span></td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <button class="btn btn-sm btn-warning" onclick="editUser('edit-profile.html')">
                                        Editar
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteUser('Juan Pérez')">
                                        Borrar
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-grid gap-2 mt-4">
                <a href="Account_Management_Screen.html" class="btn btn-outline-secondary">
                    Volver al Panel de Control
                </a>
            </div>
        </div>
    </div>

    <script>
        /**
         * Logic for user management actions.
         * Using English for internal function names and logic.
         */
        
        function editUser(page) {
            Swal.fire({
                title: 'Cargando perfil...',
                timer: 800,
                background: '#1e293b',
                color: '#ffffff',
                showConfirmButton: false,
                didOpen: () => { Swal.showLoading(); }
            }).then(() => {
                window.location.href = page;
            });
        }

        function deleteUser(userName) {
            Swal.fire({
                title: '¿Estás seguro?',
                text: `Vas a eliminar a ${userName}. Esta acción no se puede deshacer.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar',
                background: '#1e293b',
                color: '#ffffff'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: 'Eliminado',
                        text: 'El usuario ha sido borrado.',
                        icon: 'success',
                        background: '#1e293b',
                        color: '#ffffff'
                    });
                    // Aquí iría la lógica para quitar la fila de la tabla
                }
            });
        }
    </script>

    <footer class="footer bg-light text-center py-3 mt-5">
        <div class="container">
            <span class="text-muted">
                © 2026 LigaApp · Proyecto académico
            </span>
        </div>
    </footer>
</body>
</html>
