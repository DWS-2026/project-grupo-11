{{>fragments/header}}

<div class="form-container container mt-4" style="max-width: 900px;">
    <div class="text-center mb-4">
        <h2 class="text-white fw-bold">Gestión de Equipos</h2>
        <p class="text-white-50">Equipos participantes en la Liga Pro</p>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-hover align-middle border-secondary">
            <thead class="text-info">
                <tr>
                    <th>Escudo</th>
                    <th>Nombre del Equipo</th>
                    <th>Estadio</th>
                    <th class="text-center">Acciones</th>
                </tr>
            </thead>
            <tbody id="teamTableBody">
                {{#teams}}
                <tr>
                    <td>
                        <img src="{{#logoBase64}}data:image/png;base64,{{logoBase64}}{{/logoBase64}}{{^logoBase64}}/images/default-logo.png{{/logoBase64}}" 
                             alt="Logo" 
                             style="width: 45px; height: 45px; object-fit: contain; border-radius: 4px;">
                    </td>
                    <td class="text-white fw-bold">{{name}}</td>
                    <td class="text-white-50">{{stadiumName}}</td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center gap-2">
                            <a href="/teams/edit/{{id}}" class="btn btn-sm btn-warning">Editar</a>
                            
                            <button class="btn btn-sm btn-danger" 
                                    onclick="confirmDeleteTeam('{{id}}', '{{name}}')">
                                Borrar
                            </button>
                            
                            <form id="delete-team-form-{{id}}" action="/teams/delete/{{id}}" method="get" style="display:none;"></form>
                        </div>
                    </td>
                </tr>
                {{/teams}}
                
                {{^teams}}
                <tr>
                    <td colspan="4" class="text-center text-white-50">No hay equipos registrados actualmente.</td>
                </tr>
                {{/teams}}
            </tbody>
        </table>
    </div>

    <div class="d-grid gap-2 mt-4 text-center">
        <a href="/teams" class="btn btn-outline-secondary">
            Actualizar Lista
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    /**
     * Lógica de confirmación de borrado con SweetAlert2
     */
    function confirmDeleteTeam(id, name) {
        Swal.fire({
            title: '¿Eliminar equipo?',
            text: `Estás a punto de borrar al ${name}. Esta acción no se puede deshacer.`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#64748b',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar',
            background: '#1e293b',
            color: '#ffffff'
        }).then((result) => {
            if (result.isConfirmed) {
                // Ejecutamos el borrado redirigiendo a la ruta del Controller
                window.location.href = '/teams/delete/' + id;
            }
        });
    }
</script>

{{>fragments/footer}}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/Team_Management.js"></script>
