{{>fragments/header}}

<h1 class="mb-4 text-white">Administración de Equipos</h1>

<div class="row g-4 justify-content-center">
    <div class="col-md-5">
        <div class="card option-card h-100 p-3">
            <div class="card-body text-center">
                <div class="option-icon mb-3"
                    style="background: linear-gradient(180deg,#bbf7d0,#10b981); color: #04201a;">➕</div>
                <h5 class="card-title">Crear Equipo</h5>
                <p class="card-text">Registra un nuevo club y su estadio en la liga</p>
                <button class="btn btn-primary w-100 mt-3" onclick="navigateTo('CreateTeam.html')">Añadir Nuevo</button>
            </div>
        </div>
    </div>

    <div class="col-md-5">
        <div class="card option-card h-100 p-3">
            <div class="card-body text-center">
                <div class="option-icon mb-3"
                    style="background: linear-gradient(180deg,#fef08a,#f59e0b); color: #2b1500;">⚽</div>
                <h5 class="card-title">Gestionar Equipos</h5>
                <p class="card-text">Ver listado para editar datos o dar de baja a un equipo</p>
                <button class="btn btn-warning w-100 mt-3" onclick="navigateTo('ModifyTeam.html')">Ir al
                    Listado</button>
            </div>
        </div>
    </div>
</div>

<div class="mt-5">
    <a href="Admin_Page.html" class="btn btn-outline-secondary">Volver al Panel Principal</a>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    /**
     * Navigation logic
     * Consistent with Account management style.
     */
    function navigateTo(page) {
        window.location.href = page;
    }
</script>

{{>fragments/footer}}
