<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Perfil - Liga Pro</title>

     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Common styles -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">⚽ FootLeague 2026</a>
            <div class="navbar-nav ms-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <h4 class="mb-0">Configuración del Perfil</h4>
                    </div>
                    <div class="card-body p-4">
                        <form action="profile.html">
                            <div class="row">
                                <div class="col-md-4 text-center mb-4">
                                    <img src="../images/Juan_Perez_Avatar.PNG" class="rounded-circle img-thumbnail mb-2" alt="Avatar">
                                    <div class="mb-3">
                                        <label for="formFileSm" class="form-label small text-primary">Cambiar foto</label>
                                        <input class="form-control form-control-sm" id="formFileSm" type="file">
                                    </div>
                                </div>
                                
                                <div class="col-md-8">
                                    <div class="mb-3">
                                        <label class="form-label text-primary">Nombre Completo</label>
                                        <input type="text" class="form-control" value="Juan Pérez">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-primary">Correo Electrónico</label>
                                        <input type="email" class="form-control" value="juan.perez@prensa.com">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label text-primary">Nueva Contraseña</label>
                                        <input type="password" class="form-control" placeholder="Dejar en blanco para no cambiar">
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label text-primary">Equipo Favorito</label>
                                        <select class="form-select">
                                            <option value="1" selected>Real Madrid CF</option>
                                            <option value="2">FC Barcelona</option>
                                            <option value="3">Atlético de Madrid</option>
                                        </select>
                                    </div>
                                    
                                    <div class="d-flex justify-content-end gap-2">
                                        <a href="profile.html" class="btn btn-light">Cancelar</a>
                                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <footer class="footer bg-light text-center py-3 mt-5">
        <div class="container">
            <span class="text-muted">
                © 2026 LigaApp · Proyecto académico
            </span>
        </div>
    </footer>
    
</body>
</html>
