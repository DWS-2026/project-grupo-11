{{>fragments/header}}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0">Configuración del Perfil</h4>
            </div>
            <div class="card-body p-4">
                <form action="/profile/edit" method="post">
                    <div class="row">
                        <div class="col-md-4 text-center mb-4">
                            <img src="{{#user.avatarPath}}{{user.avatarPath}}{{/user.avatarPath}}{{^user.avatarPath}}/images/default-avatar.png{{/user.avatarPath}}" 
                                class="rounded-circle img-thumbnail mb-2" alt="Avatar" style="width: 150px; height: 150px; object-fit: cover;">
                            <div class="mb-3">
                                <label for="formFileSm" class="form-label small text-primary">Cambiar foto</label>
                                <input class="form-control form-control-sm" name="avatarPath" id="formFileSm" type="file">
                            </div>
                        </div>

                        <div class="col-md-8">
                            <div class="mb-3">
                                <label class="form-label text-primary">Nombre Usuario</label>
                                <input type="text" name="username" class="form-control" value="{{user.username}}" readonly>
                                <div class="form-text">El nombre de usuario no se puede modificar.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-primary">Correo Electrónico</label>
                                <input type="email" name="email" class="form-control" value="{{user.email}}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-primary">Nueva Contraseña</label>
                                <input type="password" name="password" class="form-control"
                                    placeholder="Dejar en blanco para no cambiar">
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-primary">Equipo Favorito</label>
                                <select class="form-select" name="favouriteTeam">
                                    <option disabled>Selecciona un equipo...</option>
                                    <option value="1">Real Madrid CF</option>
                                    <option value="2">FC Barcelona</option>
                                    <option value="3">Atlético de Madrid</option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="/profile/{{user.username}}" class="btn btn-light">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{{>fragments/footer}}
