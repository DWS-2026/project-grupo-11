<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FootLeague 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.0-rc.2/dist/quill.snow.css" rel="stylesheet" />
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="/">⚽ FootLeague 2026</a>

            <div class="d-flex gap-2 ms-auto align-items-center">
                {{#loggedUser}}
                <span class="text-white me-2">Hola, <strong>{{username}}</strong></span>
                <a href="/profile/{{username}}" class="btn btn-outline-light btn-sm">Mi perfil</a>
                <form action="/logout" method="post" class="m-0">
                    <input type="hidden" name="_csrf" value="{{token}}">
                    <button type="submit" class="btn btn-primary btn-sm">Cerrar Sesión</button>
                </form>
                {{/loggedUser}}

                {{^loggedUser}}
                <a href="/login" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
                <a href="/register" class="btn btn-primary btn-sm">Registrarse</a>
                {{/loggedUser}}
            </div>
        </div>
    </nav>

    <div class="container py-4">
