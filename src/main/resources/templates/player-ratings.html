{{>fragments/header}}

<div class="form-container">
    <h1 class="h4 text-white text-center mb-4">Valorar Evento del Partido</h1>

    <form action="/rating/save" method="post" style="display: inline;"> 
        <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
        <div class="mb-3">
            <label class="form-label">Seleccionar Evento</label>
            <select class="form-control search-box text-white bg-dark" name="eventId" required>
                {{#events}}
                    <option value="{{id}}">{{type}} - {{team.name}} (Min {{minute}})</option>
                {{/events}}
            </select>
            <small class="text-white-50 mt-1 d-block">Solo aparecen eventos del partido seleccionado</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Tu Puntuación (1-5)</label>
            <input type="range" name="score" class="form-range" min="1" max="5" id="eventRating">
            <div class="d-flex justify-content-between text-white-50 small">
                <span>Muy mal</span>
                <span>Excelente</span>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Comentario</label>
            <textarea class="form-control search-box" name="comment" rows="3" placeholder="Tu opinión técnica..." required></textarea>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary" id="continueBtn">Enviar Valoración</button>
            <a href="/my-ratings" class="btn btn-outline-info btn-sm py-2">Ver mis valoraciones anteriores</a>
            <a href="/match/{{matchId}}" class="btn btn-return text-center py-2">Cancelar</a>
        </div>
    </form>
</div>
</div>

{{>fragments/footer}}
