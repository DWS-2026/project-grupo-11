{{>fragments/header}}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Registro de Periodista</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted text-center mb-4">Únete a la plataforma para valorar a tus jugadores favoritos.</p>

                <form action="/register" method="post" enctype="multipart/form-data">
                    <input type="hidden" name="_csrf" value="{{_csrf.token}}"/>
                    <div class="mb-3">
                        <label class="form-label text-primary">Nombre Usuario</label>
                        <input type="text" name="username" class="form-control" placeholder="Ej. JuanPérez"
                            pattern="^\S+$" title="El nombre de usuario no puede contener espacios" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-primary">Correo Electrónico</label>
                        <input type="email" name="email" class="form-control" placeholder="nombre@ejemplo.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-primary">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-primary">Confirmar Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-primary">Foto de Perfil (Avatar)</label>
                        <input class="form-control" type="file" name="imageFile" id="formFile">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-primary">Equipo Favorito</label>
                        <select class="form-select" name="favouriteTeam" required>
                            <option selected disabled>Selecciona un equipo...</option>
                            {{#teams}}<option value="{{id}}">{{name}}</option>
                            {{/teams}}
                        </select>
                        <div class="form-text">Esto determinará sobre qué equipo podrás ejercer como periodista.</div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Crear Cuenta</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                ¿Ya tienes cuenta? <a href="/login" class="text-decoration-none">Inicia sesión aquí</a>
            </div>
        </div>
    </div>
</div>

{{>fragments/footer}}
